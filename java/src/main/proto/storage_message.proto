syntax = "proto3";

package pcbook.v1;

option go_package = "github.com/tndgoat/pcbook/pb;pb";

// Java-specific options
option java_package = "com.github.tndgoat.pcbook.db";
option java_multiple_files = true;

import "memory_message.proto";

message Storage {
  enum Driver {
    UNKNOWN = 0;
    HDD = 1;
    SSD = 2;
  }

  Driver driver = 1;
  Memory memory = 2;
}