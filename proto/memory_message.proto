syntax = "proto3";

package pcbook.v1;

option go_package = "github.com/tndgoat/pcbook/pb;pb";

// Java-specific options
option java_package = "com.github.tndgoat.pcbook.db";
option java_multiple_files = true;

message Memory {
  enum Unit {
    UNKNOWN = 0;
    BIT = 1;
    BYTE = 2;
    KILOBYTE = 3;
    MEGABYTE = 4;
    GIGABYTE = 5;
    TERABYTE = 6;
  }

  uint64 value = 1;
  Unit unit = 2;
}