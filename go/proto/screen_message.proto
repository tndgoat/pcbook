syntax = "proto3";

package pcbook.v1;

option go_package = "github.com/tndgoat/pcbook/pb;pb";

// Java-specific options
option java_package = "com.github.tndgoat.pcbook.db";
option java_multiple_files = true;

message Screen {
  message Resolution {
    uint32 width = 1;
    uint32 height = 2;
  }

  enum Panel {
    UNKNOWN = 0;
    IPS = 1;
    OLED = 2;
  }

  float size_inch = 1; 
  Resolution resolution = 2;
  Panel panel = 3;
  bool multitouch = 4;
}